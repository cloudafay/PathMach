<!DOCTYPE html>

<html lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PathMatch - Kayıt Ol</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#fcf8fa",
                        "tertiary-fixed": "#e9ddff",
                        "on-primary-fixed-variant": "#3f465c",
                        "tertiary-fixed-dim": "#d0bcff",
                        "primary-container": "#131b2e",
                        "primary-fixed-dim": "#bec6e0",
                        "on-surface-variant": "#45464d",
                        "primary": "#000000",
                        "surface-dim": "#dcd9db",
                        "secondary-fixed": "#acedff",
                        "outline-variant": "#c6c6cd",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#4cd7f6",
                        "surface": "#fcf8fa",
                        "surface-container-highest": "#e4e2e4",
                        "on-tertiary-container": "#9466ff",
                        "surface-container": "#f0edef",
                        "surface-container-low": "#f6f3f5",
                        "surface-container-high": "#eae7e9",
                        "surface-tint": "#565e74",
                        "on-primary-fixed": "#131b2e",
                        "primary-fixed": "#dae2fd",
                        "inverse-surface": "#303032",
                        "outline": "#76777d",
                        "background": "#fcf8fa",
                        "tertiary-container": "#23005c",
                        "on-background": "#1b1b1d",
                        "on-secondary-fixed": "#001f26",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1b1d",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#5516be",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#57dffe",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "tertiary": "#000000",
                        "on-secondary-container": "#006172",
                        "on-tertiary-fixed": "#23005c",
                        "error-container": "#ffdad6",
                        "secondary": "#00687a",
                        "on-primary-container": "#7c839b",
                        "on-secondary-fixed-variant": "#004e5c",
                        "surface-variant": "#e4e2e4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2xl": "48px",
                        "3xl": "64px",
                        "xl": "32px",
                        "md": "16px",
                        "base": "4px",
                        "lg": "24px",
                        "sm": "12px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "h2": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"],
                        "button": ["Plus Jakarta Sans"],
                        "h1": ["Plus Jakarta Sans"],
                        "label-bold": ["Inter"],
                        "body-lg": ["Inter"],
                        "h3": ["Plus Jakarta Sans"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["32px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "button": ["16px", { "lineHeight": "1", "fontWeight": "600" }],
                        "h1": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "label-bold": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "h3": ["24px", { "lineHeight": "1.4", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex text-on-background">
<!-- Split Layout Container -->
<div class="flex w-full h-screen">
<!-- Left Column: Branding & Illustration (Hidden on mobile) -->
<div class="hidden lg:flex flex-col w-1/2 relative bg-surface-container-low overflow-hidden">
<!-- Decorative Elements -->
<div class="absolute top-0 left-0 w-full h-full bg-gradient-to-br from-tertiary-fixed-dim/20 to-secondary-fixed/20 pointer-events-none"></div>
<div class="relative z-10 flex flex-col justify-between h-full p-3xl">
<!-- Logo/Brand -->
<div>
<h1 class="font-h2 text-h2 text-primary">PathMatch</h1>
</div>
<!-- Messaging -->
<div class="max-w-md">
<h2 class="font-h1 text-h1 text-on-background mb-md">Kariyer yolculuğunu PathMatch ile başlat</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Gelecek odaklı profesyoneller için akıllı eşleşme platformu. Yeteneklerini keşfet, fırsatları yakala.</p>
</div>
<!-- Illustration Placeholder -->
<div class="w-full h-64 rounded-xl overflow-hidden shadow-lg border border-outline-variant/30">
<img alt="Modern office collaboration" class="w-full h-full object-cover object-center" data-alt="A modern, high-key brightly lit office scene showing a diverse team of young professionals collaborating enthusiastically around a sleek glass table. The atmosphere is vibrant and optimistic, representing the 'Future-Focused Professionalism' brand identity. The color palette emphasizes soft, light backgrounds with crisp white surfaces, accented by subtle, deep navy tones and clean, modern aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJ6AwEoBOd-4cRUmQVfqRmhotZxwJq-4bKd95y_qAb_Y-5SW49x87Ywgx27QNBryofB7tQsDtx-f2R99gp3TVsv2r0FRcuuMKRgpsS8LoWj3EylMc6kfqKZwUXzwg-6RcbHriZ_lTU4Bn-Zt5JhbHPgQHnbXx2dRq8Tei6VZ3YcVN2PxHsH1REY9I-2jEAOZJf4PJR6aWxiPhLUVYvH6UFGEvw77asPG_eVanK3TZt-ST4F3dK-SewCSCnYqE-nmvdEIZHW10PA-8"/>
</div>
</div>
</div>
<!-- Right Column: Registration Form -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-md sm:p-xl lg:p-3xl bg-surface-bright relative">
<!-- Mobile Logo -->
<div class="absolute top-md left-md lg:hidden">
<h1 class="font-h3 text-h3 text-primary">PathMatch</h1>
</div>
<!-- Form Card -->
<div class="glass-panel w-full max-w-md rounded-[16px] p-lg sm:p-xl shadow-[0_8px_30px_rgb(15,23,42,0.04)]">
<div class="mb-xl text-center">
<h2 class="font-h2 text-h2 text-on-background mb-xs">Hesap Oluştur</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">PathMatch dünyasına adım at.</p>
</div>
<form class="space-y-md">
<!-- Full Name -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-base" for="fullName">Ad Soyad</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 text-on-background font-body-md text-body-md rounded-lg px-md py-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors" id="fullName" placeholder="Örn. Ali Yılmaz" type="text"/>
</div>
<!-- Email -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-base" for="email">E-posta Adresi</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 text-on-background font-body-md text-body-md rounded-lg px-md py-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors" id="email" placeholder="ornek@email.com" type="email"/>
</div>
<!-- Password -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-base" for="password">Şifre</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 text-on-background font-body-md text-body-md rounded-lg px-md py-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
<!-- Role Selection (Bento-style Radio Buttons) -->
<div class="pt-sm">
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-sm">Hesap Türü</label>
<div class="grid grid-cols-3 gap-sm">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="role" type="radio" value="student"/>
<div class="h-full flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant/50 bg-surface-container-lowest peer-checked:border-secondary peer-checked:bg-secondary-fixed/10 peer-checked:text-secondary text-on-surface-variant transition-all">
<span class="material-symbols-outlined mb-base">school</span>
<span class="font-label-bold text-label-bold">Öğrenci</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="company"/>
<div class="h-full flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant/50 bg-surface-container-lowest peer-checked:border-secondary peer-checked:bg-secondary-fixed/10 peer-checked:text-secondary text-on-surface-variant transition-all">
<span class="material-symbols-outlined mb-base">business_center</span>
<span class="font-label-bold text-label-bold">Şirket</span>
</div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="role" type="radio" value="mentor"/>
<div class="h-full flex flex-col items-center justify-center p-sm rounded-lg border border-outline-variant/50 bg-surface-container-lowest peer-checked:border-secondary peer-checked:bg-secondary-fixed/10 peer-checked:text-secondary text-on-surface-variant transition-all">
<span class="material-symbols-outlined mb-base">psychology</span>
<span class="font-label-bold text-label-bold">Mentor</span>
</div>
</label>
</div>
</div>
<!-- Dynamic Field: Univ/Company Name -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface-variant mb-base" for="institution">Üniversite / Şirket Adı</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/50 text-on-background font-body-md text-body-md rounded-lg px-md py-sm focus:outline-none focus:border-secondary-fixed focus:ring-1 focus:ring-secondary-fixed transition-colors" id="institution" placeholder="Kurumunuzu girin" type="text"/>
</div>
<!-- Submit Button -->
<div class="pt-md">
<button class="w-full bg-primary text-on-primary font-button text-button py-sm rounded-lg hover:bg-primary-container transition-colors shadow-sm flex items-center justify-center gap-2" type="submit">
<span>Kayıt Ol</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Zaten hesabın var mı? 
                        <a class="font-label-bold text-label-bold text-secondary hover:text-secondary-fixed transition-colors" href="#">Giriş Yap</a>
</p>
</div>
</div>
</div>
</div>
<script src="../pathmatch-live.js"></script>
</body></html>
